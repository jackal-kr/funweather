MOD_FUNWEATHER_T_TIP_AUTUMN_CLEAR_2="Rześko i słonecznie. Idealnie na ostatnie jabłka."
MOD_FUNWEATHER_T_TIP_AUTUMN_CALM_1="Szary jesienny dzień - dobry na porządki w rabatach i kompost."
MOD_FUNWEATHER_T_TIP_AUTUMN_CALM_2="Pochmurno i spokojnie. Grab liście, rób kompost, poczuj się produktywnie."
MOD_FUNWEATHER_T_TIP_AUTUMN_RAIN_1="Jesienny deszcz - ziemia pije, Ty zostajesz suchy."
MOD_FUNWEATHER_T_TIP_AUTUMN_RAIN_2="Mokry jesienny dzień. Kalosze i gorąca herbata, działka jutro."
MOD_FUNWEATHER_T_TIP_AUTUMN_SNOW_1="Pierwszy śnieg! Czas zamykać sezon."
MOD_FUNWEATHER_T_TIP_AUTUMN_SNOW_2="Wczesny śnieg - zabezpiecz delikatne rośliny i uznaj rok za zamknięty."
MOD_FUNWEATHER_T_TIP_AUTUMN_STORM_1="Jesienna burza! Zabezpiecz altankę i zostań w domu."
MOD_FUNWEATHER_T_TIP_AUTUMN_STORM_2="Grzmoty i wiatr. Spadające gałęzie - lepiej nie wychodzić."
MOD_FUNWEATHER_T_TIP_AUTUMN_FOG_1="Jesienna mgła - nastrojowo, ale uważaj na liście na alejkach."
