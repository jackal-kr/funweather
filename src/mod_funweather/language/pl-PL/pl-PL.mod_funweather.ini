MOD_FUNWEATHER_T_TIP_SUMMER_FOG_2="Mglisty letni poranek. Dobry czas na spokojną kawę na działce."
MOD_FUNWEATHER_T_TIP_SUMMER_FROST_1="Przymrozek latem? Rzadkość. Na wszelki wypadek przykryj pomidory."
MOD_FUNWEATHER_T_TIP_SUMMER_FROST_2="Nietypowo zimno. Przykryj wrażliwe rośliny."
MOD_FUNWEATHER_T_TIP_SUMMER_WIND_1="Wietrzny letni dzień - podwiąż pomidory i fasolę."
MOD_FUNWEATHER_T_TIP_SUMMER_WIND_2="Porywy! Sprawdź podpory fasoli i słoneczników."
MOD_FUNWEATHER_T_TIP_SUMMER_HOT_1="Upał! Podlewaj rano lub wieczorem i sam pij więcej wody."
MOD_FUNWEATHER_T_TIP_SUMMER_HOT_2="Bardzo gorąco. Fasola też się poci - podlej wieczorem, a sam odpocznij w cieniu."
MOD_FUNWEATHER_T_TIP_SUMMER_NIGHT_1="Ciepła letnia noc - świerszcze, gwiazdy i rosnące warzywa."
MOD_FUNWEATHER_T_TIP_SUMMER_NIGHT_2="Letnia noc. Ogórki rosną, gdy Ty odpoczywasz."
