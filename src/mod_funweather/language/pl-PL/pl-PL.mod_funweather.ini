MOD_FUNWEATHER_T_TIP_WINTER_NICE_1="Łagodny zimowy dzień! Ciesz się nim, działka wciąż śpi."
MOD_FUNWEATHER_T_TIP_WINTER_NICE_2="Ciepło jak na zimę. Nie budź roślin zbyt wcześnie!"
MOD_FUNWEATHER_T_TIP_WINTER_CLEAR_1="Zimowe słońce - najlepsza darmowa witamina D."
MOD_FUNWEATHER_T_TIP_WINTER_CLEAR_2="Słonecznie i rześko. Świetny dzień na spacer na działkę."
MOD_FUNWEATHER_T_TIP_WINTER_CALM_1="Szary zimowy dzień. Czas zaplanować rabaty na nowy sezon."
MOD_FUNWEATHER_T_TIP_WINTER_CALM_2="Pochmurno i cicho. Pogoda na katalogi nasion i gorącą herbatę."
MOD_FUNWEATHER_T_TIP_WINTER_RAIN_1="Zimowy deszcz - błoto na alejkach, załóż kalosze."
MOD_FUNWEATHER_T_TIP_WINTER_RAIN_2="Mokry dzień. Katalogi nasion i gorąca herbata wołają."
MOD_FUNWEATHER_T_TIP_WINTER_SNOW_1="Śnieg okrył działkę - naturalna kołdra dla roślin."
MOD_FUNWEATHER_T_TIP_WINTER_SNOW_2="Działka śpi. Lepiej ulep bałwana."
MOD_FUNWEATHER_T_TIP_WINTER_STORM_1="Zimowa burza! Dach altanki sprawdzisz później, teraz zostań w domu."
MOD_FUNWEATHER_T_TIP_WINTER_STORM_2="Grzmoty zimą? Rzadkość. Przeczekaj w cieple."
MOD_FUNWEATHER_T_TIP_WINTER_FOG_1="Zimowa mgła - uważaj na oblodzone alejki."
MOD_FUNWEATHER_T_TIP_WINTER_FOG_2="Mgliście i zimno. Dobry dzień na planowanie przy herbacie."
MOD_FUNWEATHER_T_TIP_WINTER_FROST_1="Mróz, jak to w zimie. Sprawdź, czy osłony roślin trzymają."
MOD_FUNWEATHER_T_TIP_WINTER_FROST_2="Mroźny dzień. Najpierw ciepła herbata, potem działka."
MOD_FUNWEATHER_T_TIP_WINTER_WIND_1="Silny zimowy wiatr - zabezpiecz drzwi altanki i osłony."
MOD_FUNWEATHER_T_TIP_WINTER_WIND_2="Wieje i marznie. Trzymaj czapkę i agrowłókninę!"
MOD_FUNWEATHER_T_TIP_WINTER_HOT_1="Ciepło jak na zimę! Śpiące rośliny mogą obudzić się za wcześnie."
MOD_FUNWEATHER_T_TIP_WINTER_HOT_2="Prawie wiosna? Nie ufaj, zima jeszcze może wrócić."
MOD_FUNWEATHER_T_TIP_WINTER_NIGHT_1="Zimowa noc. Działka odpoczywa, Ty też."
MOD_FUNWEATHER_T_TIP_WINTER_NIGHT_2="Długa noc, zimna ziemia. Marzyć o pomidorach wolno."
MOD_FUNWEATHER_T_TIP_SPRING_NICE_1="Idealny wiosenny dzień - czas siać!"
MOD_FUNWEATHER_T_TIP_SPRING_NICE_2="Ciepłe słońce, obudzona ziemia. Sezon oficjalnie otwarty."
MOD_FUNWEATHER_T_TIP_SPRING_CLEAR_1="Słonecznie, ale rześko - świetnie do kopania i grabienia."
MOD_FUNWEATHER_T_TIP_SPRING_CLEAR_2="Jasny wiosenny dzień. Rozsada chce słońca, Ty kawy na świeżym powietrzu."
MOD_FUNWEATHER_T_TIP_SPRING_CALM_1="Łagodne wiosenne niebo - dobry dzień na siew i pielenie."
MOD_FUNWEATHER_T_TIP_SPRING_CALM_2="Pochmurno i spokojnie: rozsada to lubi, Ty też."
MOD_FUNWEATHER_T_TIP_SPRING_RAIN_1="Wiosenny deszcz - rośliny zachwycone, alejki mniej."
MOD_FUNWEATHER_T_TIP_SPRING_RAIN_2="Darmowe podlewanie dla młodych siewek. Konewka zostaje w szopie."
MOD_FUNWEATHER_T_TIP_SPRING_SNOW_1="Późny śnieg! Przykryj rozsadę, wiosna sprawdza naszą cierpliwość."
MOD_FUNWEATHER_T_TIP_SPRING_SNOW_2="Śnieg w kwietniu? Klasyk. Stopnieje, a kwiaty i tak wygrają."
MOD_FUNWEATHER_T_TIP_SPRING_STORM_1="Wiosenna burza! Zamknij szklarnię i przeczekaj."
MOD_FUNWEATHER_T_TIP_SPRING_STORM_2="Grzmoty! Rozsada zostaje w domu, Ty też."
MOD_FUNWEATHER_T_TIP_SPRING_FOG_1="Poranna mgła wiosną - zaraz się rozejdzie i będzie ładny dzień."
MOD_FUNWEATHER_T_TIP_SPRING_FOG_2="Mglisty początek. Rozsadzie nic nie jest, uważaj pod nogami."
MOD_FUNWEATHER_T_TIP_SPRING_FROST_1="Nocny przymrozek! Przykryj rozsadę i młode kwiaty."
MOD_FUNWEATHER_T_TIP_SPRING_FROST_2="Alarm przymrozkowy - pomidory jeszcze chwilę zostają w domu."
MOD_FUNWEATHER_T_TIP_SPRING_WIND_1="Wietrzny wiosenny dzień - zabezpiecz młode rośliny i folię."
MOD_FUNWEATHER_T_TIP_SPRING_WIND_2="Porywy! Rozsada nisko, agrowłóknina dobrze przypięta."
MOD_FUNWEATHER_T_TIP_SPRING_HOT_1="Upalna wiosna! Podlewaj wieczorem i osłaniaj siewki."
MOD_FUNWEATHER_T_TIP_SPRING_HOT_2="Lato przyszło za wcześnie? Podlej młode rośliny."
MOD_FUNWEATHER_T_TIP_SPRING_NIGHT_1="Wiosenna noc - rośliny rosną, gdy śpisz."
MOD_FUNWEATHER_T_TIP_SPRING_NIGHT_2="Chłodna wiosenna noc. Przed snem sprawdź prognozę przymrozków."
MOD_FUNWEATHER_T_TIP_SUMMER_NICE_1="Idealny letni dzień - grill i działka są zachwyceni."
MOD_FUNWEATHER_T_TIP_SUMMER_NICE_2="Słonecznie i przyjemnie. Zbierz truskawki, zanim zrobią to ptaki."
MOD_FUNWEATHER_T_TIP_SUMMER_CLEAR_1="Słonecznie, ale świeżo - praca bez zlewania się potem."
MOD_FUNWEATHER_T_TIP_SUMMER_CLEAR_2="Czyste niebo i chłodny wiatr. Pogoda na pielenie, bez wymówek."
MOD_FUNWEATHER_T_TIP_SUMMER_CALM_1="Pochmurny letni dzień - idealny do pielenia, bez poparzeń."
MOD_FUNWEATHER_T_TIP_SUMMER_CALM_2="Łagodnie i pochmurno. Prace w ogrodzie bez roztopienia się."
MOD_FUNWEATHER_T_TIP_SUMMER_RAIN_1="Letni deszcz - ogród pije, Ty możesz odpocząć."
MOD_FUNWEATHER_T_TIP_SUMMER_RAIN_2="Ciepły deszcz! Ogórki w euforii, Ty bierz książkę."
MOD_FUNWEATHER_T_TIP_SUMMER_SNOW_1="Śnieg latem? Sprawdź kalendarz - albo prognozę."
MOD_FUNWEATHER_T_TIP_SUMMER_SNOW_2="Śnieg?! Pogoda chyba pomyliła pory roku. Zostań w domu."
MOD_FUNWEATHER_T_TIP_SUMMER_STORM_1="Letnia burza! Odłóż narzędzia, wejdź do środka, działkę sprawdzisz później."
MOD_FUNWEATHER_T_TIP_SUMMER_STORM_2="Grzmoty i błyskawice - zostaw szpadel i schowaj się."
