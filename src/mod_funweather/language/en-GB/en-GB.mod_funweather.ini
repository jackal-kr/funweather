MOD_FUNWEATHER_SHOW_TIP_DESC="A one-line, light-hearted remark matching the weather and the season (e.g. a frost warning for gardeners). The wording rotates daily."
MOD_FUNWEATHER_T_TIP_WINTER_NICE_1="Mild winter day! Enjoy it, the garden is still asleep."
MOD_FUNWEATHER_T_TIP_WINTER_NICE_2="Unusually warm for winter. Don't wake the plants too early!"
MOD_FUNWEATHER_T_TIP_WINTER_CLEAR_1="Bright winter sun - the best free vitamin D."
MOD_FUNWEATHER_T_TIP_WINTER_CLEAR_2="Crisp and sunny. A lovely day for a walk to the plot."
MOD_FUNWEATHER_T_TIP_WINTER_CALM_1="Grey winter day. Time to plan next season's beds."
MOD_FUNWEATHER_T_TIP_WINTER_CALM_2="Cloudy and quiet. Seed catalogue and hot tea weather."
MOD_FUNWEATHER_T_TIP_WINTER_RAIN_1="Winter rain - muddy paths, wear your boots."
MOD_FUNWEATHER_T_TIP_WINTER_RAIN_2="Wet winter day. The seed catalogues and hot tea are calling."
MOD_FUNWEATHER_T_TIP_WINTER_SNOW_1="Snow blanket on the plot - nature's own mulch."
MOD_FUNWEATHER_T_TIP_WINTER_SNOW_2="The garden is asleep. Build a snowman instead."
MOD_FUNWEATHER_T_TIP_WINTER_STORM_1="Winter storm! Check the shed roof later, stay in for now."
MOD_FUNWEATHER_T_TIP_WINTER_STORM_2="Thunder in winter? Rare. Wait it out somewhere warm."
MOD_FUNWEATHER_T_TIP_WINTER_FOG_1="Winter fog - mind the icy paths."
MOD_FUNWEATHER_T_TIP_WINTER_FOG_2="Foggy and cold. A cosy day for indoor planning."
MOD_FUNWEATHER_T_TIP_WINTER_FROST_1="Frost, as winter intended. Check that the plant covers hold."
MOD_FUNWEATHER_T_TIP_WINTER_FROST_2="Freezing day. Hot tea first, plot later."
MOD_FUNWEATHER_T_TIP_WINTER_WIND_1="Strong winter wind - secure the shed door and covers."
MOD_FUNWEATHER_T_TIP_WINTER_WIND_2="Windy and cold. Hold on to your hat and the garden fleece!"
MOD_FUNWEATHER_T_TIP_WINTER_HOT_1="Warm for winter! Sleepy plants may wake up too early."
MOD_FUNWEATHER_T_TIP_WINTER_HOT_2="Almost spring? Don't trust it, winter may come back."
MOD_FUNWEATHER_T_TIP_WINTER_NIGHT_1="Winter night. The garden rests, and so should you."
MOD_FUNWEATHER_T_TIP_WINTER_NIGHT_2="Long night, cold soil. Dreaming of tomatoes is allowed."
MOD_FUNWEATHER_T_TIP_SPRING_NICE_1="Perfect spring day - sowing time!"
MOD_FUNWEATHER_T_TIP_SPRING_NICE_2="Warm sun, awake soil. The season is officially open."
MOD_FUNWEATHER_T_TIP_SPRING_CLEAR_1="Sunny but fresh - great for digging and raking."
MOD_FUNWEATHER_T_TIP_SPRING_CLEAR_2="Bright spring day. Seedlings want sunlight, you want coffee outside."
MOD_FUNWEATHER_T_TIP_SPRING_CALM_1="Soft spring sky - a good day for sowing and weeding."
MOD_FUNWEATHER_T_TIP_SPRING_CALM_2="Cloudy and calm: the seedlings like it, and so do you."
MOD_FUNWEATHER_T_TIP_SPRING_RAIN_1="Spring rain - the plants are thrilled, the paths less so."
MOD_FUNWEATHER_T_TIP_SPRING_RAIN_2="Free watering for the young seedlings. The can stays in the shed."
MOD_FUNWEATHER_T_TIP_SPRING_SNOW_1="Late snow! Cover the seedlings, spring is testing our patience."
MOD_FUNWEATHER_T_TIP_SPRING_SNOW_2="Snow in April? A classic. It will melt and the flowers will win anyway."
MOD_FUNWEATHER_T_TIP_SPRING_STORM_1="Spring storm! Close the greenhouse and wait it out."
MOD_FUNWEATHER_T_TIP_SPRING_STORM_2="Thunder! The seedlings stay inside, and so do you."
MOD_FUNWEATHER_T_TIP_SPRING_FOG_1="Spring morning fog - it will clear into a nice day."
MOD_FUNWEATHER_T_TIP_SPRING_FOG_2="Misty start. The seedlings are fine, mind your step."
MOD_FUNWEATHER_T_TIP_SPRING_FROST_1="Night frost! Cover the seedlings and young blossoms."
MOD_FUNWEATHER_T_TIP_SPRING_FROST_2="Frost alert - the tomatoes stay indoors a little longer."
MOD_FUNWEATHER_T_TIP_SPRING_WIND_1="Windy spring day - protect the young plants and the foil."
MOD_FUNWEATHER_T_TIP_SPRING_WIND_2="Gusty! Keep the seedlings low and the fleece well pinned."
MOD_FUNWEATHER_T_TIP_SPRING_HOT_1="Hot spring day! Water in the evening and shade the seedlings."
MOD_FUNWEATHER_T_TIP_SPRING_HOT_2="Summer came early? Give the young plants a drink."
MOD_FUNWEATHER_T_TIP_SPRING_NIGHT_1="Spring night - the plants are growing while you sleep."
MOD_FUNWEATHER_T_TIP_SPRING_NIGHT_2="Cool spring night. Check the frost forecast before bed."
MOD_FUNWEATHER_T_TIP_SUMMER_NICE_1="Perfect summer day - the barbecue and the garden both approve."
MOD_FUNWEATHER_T_TIP_SUMMER_NICE_2="Sunny and pleasant. Pick the strawberries before the birds do."
MOD_FUNWEATHER_T_TIP_SUMMER_CLEAR_1="Sunny but fresh - work without melting."
MOD_FUNWEATHER_T_TIP_SUMMER_CLEAR_2="Clear sky and a cool breeze. Weeding weather, no excuses."
MOD_FUNWEATHER_T_TIP_SUMMER_CALM_1="Cloudy summer day - ideal for weeding without sunburn."
MOD_FUNWEATHER_T_TIP_SUMMER_CALM_2="Mild and cloudy. Garden work without melting."
MOD_FUNWEATHER_T_TIP_SUMMER_RAIN_1="Summer rain - the garden drinks, you can rest."
MOD_FUNWEATHER_T_TIP_SUMMER_RAIN_2="Warm rain! The cucumbers cheer, you grab a book."
MOD_FUNWEATHER_T_TIP_SUMMER_SNOW_1="Snow in summer? Check the calendar - or the forecast."
MOD_FUNWEATHER_T_TIP_SUMMER_SNOW_2="Snow?! The weather has mixed up the seasons. Stay inside."
MOD_FUNWEATHER_T_TIP_SUMMER_STORM_1="Summer storm! Put the tools down, go inside, check the garden later."
MOD_FUNWEATHER_T_TIP_SUMMER_STORM_2="Thunder and lightning - leave the spade and take cover."
MOD_FUNWEATHER_T_TIP_SUMMER_FOG_1="Summer morning fog - it will burn off, then comes the heat."
MOD_FUNWEATHER_T_TIP_SUMMER_FOG_2="Misty summer morning. A good time for a quiet coffee on the plot."
MOD_FUNWEATHER_T_TIP_SUMMER_FROST_1="Frost in summer? Rare. Cover the tomatoes, just in case."
MOD_FUNWEATHER_T_TIP_SUMMER_FROST_2="Unusually cold. Cover the tender plants."
MOD_FUNWEATHER_T_TIP_SUMMER_WIND_1="Windy summer day - tie up the tomatoes and beans."
MOD_FUNWEATHER_T_TIP_SUMMER_WIND_2="Gusty! Check the supports of beans and sunflowers."
MOD_FUNWEATHER_T_TIP_SUMMER_HOT_1="Heatwave! Water early or late, and drink more water yourself."
MOD_FUNWEATHER_T_TIP_SUMMER_HOT_2="Very hot. The beans sweat too - water in the evening, rest in the shade."
MOD_FUNWEATHER_T_TIP_SUMMER_NIGHT_1="Warm summer night - crickets, stars and growing vegetables."
MOD_FUNWEATHER_T_TIP_SUMMER_NIGHT_2="Summer night. The cucumbers grow while you rest."
MOD_FUNWEATHER_T_TIP_AUTUMN_NICE_1="Golden autumn day - harvest and rake leaves in the sun."
MOD_FUNWEATHER_T_TIP_AUTUMN_NICE_2="Mild and sunny: enjoy it, the last warm days are a gift."
MOD_FUNWEATHER_T_TIP_AUTUMN_CLEAR_1="Clear autumn day - great for harvesting and planting bulbs."
MOD_FUNWEATHER_T_TIP_AUTUMN_CLEAR_2="Crisp and sunny. Perfect for the last apples."
MOD_FUNWEATHER_T_TIP_AUTUMN_CALM_1="Grey autumn day - good for tidying beds and making compost."
MOD_FUNWEATHER_T_TIP_AUTUMN_CALM_2="Cloudy and calm. Rake leaves, turn the compost, feel productive."
MOD_FUNWEATHER_T_TIP_AUTUMN_RAIN_1="Autumn rain - the soil drinks, you stay dry."
MOD_FUNWEATHER_T_TIP_AUTUMN_RAIN_2="Wet autumn day. Boots and hot tea, the garden can wait until tomorrow."
MOD_FUNWEATHER_T_TIP_AUTUMN_SNOW_1="First snow! Time to wrap up the season."
MOD_FUNWEATHER_T_TIP_AUTUMN_SNOW_2="Early snow - protect the tender plants and call it a year."
MOD_FUNWEATHER_T_TIP_AUTUMN_STORM_1="Autumn storm! Secure the shed, then stay inside."
MOD_FUNWEATHER_T_TIP_AUTUMN_STORM_2="Thunder and wind. Falling branches - better to stay in."
MOD_FUNWEATHER_T_TIP_AUTUMN_FOG_1="Autumn fog - moody and pretty, but careful on the leaves."
MOD_FUNWEATHER_T_TIP_AUTUMN_FOG_2="Misty autumn morning. Slippery leaves, take care on the paths."
MOD_FUNWEATHER_T_TIP_AUTUMN_FROST_1="First frost! Bring in the tender plants and finish harvesting."
MOD_FUNWEATHER_T_TIP_AUTUMN_FROST_2="Night frost - pick what is left, cover the rest."
MOD_FUNWEATHER_T_TIP_AUTUMN_WIND_1="Windy autumn day - leaves everywhere, raking comes later."
MOD_FUNWEATHER_T_TIP_AUTUMN_WIND_2="Gusty! The leaves are playing games with you. Wait for it to calm down."
MOD_FUNWEATHER_T_TIP_AUTUMN_HOT_1="Warm for autumn - Indian summer! Enjoy the harvest outdoors."
MOD_FUNWEATHER_T_TIP_AUTUMN_HOT_2="A late summer bonus - the garden is happy, and so are you."
MOD_FUNWEATHER_T_TIP_AUTUMN_NIGHT_1="Autumn night - the garden settles in for winter."
MOD_FUNWEATHER_T_TIP_AUTUMN_NIGHT_2="Cool autumn night. The compost is working, you can rest."
