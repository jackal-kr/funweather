MOD_FUNWEATHER_T_TIP_WINTER_NICE_1="Milder Wintertag! Genießen Sie ihn, der Garten schläft noch."
MOD_FUNWEATHER_T_TIP_WINTER_NICE_2="Ungewöhnlich warm für den Winter. Die Pflanzen nicht zu früh wecken!"
MOD_FUNWEATHER_T_TIP_WINTER_CLEAR_1="Helle Wintersonne - das beste Vitamin D zum Nulltarif."
MOD_FUNWEATHER_T_TIP_WINTER_CLEAR_2="Klar und sonnig. Ein schöner Tag für einen Spaziergang zur Parzelle."
MOD_FUNWEATHER_T_TIP_WINTER_CALM_1="Grauer Wintertag. Zeit, die Beete der nächsten Saison zu planen."
MOD_FUNWEATHER_T_TIP_WINTER_CALM_2="Bewölkt und ruhig. Wetter für Samenkatalog und heißen Tee."
MOD_FUNWEATHER_T_TIP_WINTER_RAIN_1="Winterregen - matschige Wege, Gummistiefel anziehen."
MOD_FUNWEATHER_T_TIP_WINTER_RAIN_2="Nasser Wintertag. Samenkataloge und heißer Tee rufen."
MOD_FUNWEATHER_T_TIP_WINTER_SNOW_1="Schneedecke auf der Parzelle - die Mulchschicht der Natur."
MOD_FUNWEATHER_T_TIP_WINTER_SNOW_2="Der Garten schläft. Bauen Sie stattdessen einen Schneemann."
MOD_FUNWEATHER_T_TIP_WINTER_STORM_1="Wintersturm! Das Dach des Gartenhauses später prüfen, jetzt drinnen bleiben."
MOD_FUNWEATHER_T_TIP_WINTER_STORM_2="Gewitter im Winter? Selten. Warten Sie es an einem warmen Ort ab."
MOD_FUNWEATHER_T_TIP_WINTER_FOG_1="Winternebel - Vorsicht auf eisigen Wegen."
MOD_FUNWEATHER_T_TIP_WINTER_FOG_2="Neblig und kalt. Ein gemütlicher Tag zum Planen drinnen."
MOD_FUNWEATHER_T_TIP_WINTER_FROST_1="Frost, wie der Winter es will. Prüfen Sie, ob die Pflanzenabdeckungen halten."
MOD_FUNWEATHER_T_TIP_WINTER_FROST_2="Frosttag. Erst heißer Tee, dann die Parzelle."
MOD_FUNWEATHER_T_TIP_WINTER_WIND_1="Starker Winterwind - Gartenhaustür und Abdeckungen sichern."
MOD_FUNWEATHER_T_TIP_WINTER_WIND_2="Windig und kalt. Halten Sie Mütze und Gartenvlies fest!"
MOD_FUNWEATHER_T_TIP_WINTER_HOT_1="Warm für den Winter! Schläfrige Pflanzen könnten zu früh aufwachen."
MOD_FUNWEATHER_T_TIP_WINTER_HOT_2="Schon Frühling? Nicht darauf verlassen, der Winter kann zurückkommen."
MOD_FUNWEATHER_T_TIP_WINTER_NIGHT_1="Winternacht. Der Garten ruht, und Sie sollten es auch tun."
MOD_FUNWEATHER_T_TIP_WINTER_NIGHT_2="Lange Nacht, kalter Boden. Von Tomaten zu träumen ist erlaubt."
MOD_FUNWEATHER_T_TIP_SPRING_NICE_1="Perfekter Frühlingstag - Zeit zum Säen!"
MOD_FUNWEATHER_T_TIP_SPRING_NICE_2="Warme Sonne, erwachter Boden. Die Saison ist offiziell eröffnet."
MOD_FUNWEATHER_T_TIP_SPRING_CLEAR_1="Sonnig, aber frisch - ideal zum Umgraben und Harken."
MOD_FUNWEATHER_T_TIP_SPRING_CLEAR_2="Heller Frühlingstag. Die Setzlinge wollen Sonne, Sie wollen Kaffee im Freien."
MOD_FUNWEATHER_T_TIP_SPRING_CALM_1="Sanfter Frühlingshimmel - ein guter Tag zum Säen und Jäten."
MOD_FUNWEATHER_T_TIP_SPRING_CALM_2="Bewölkt und ruhig: Die Setzlinge mögen es, und Sie auch."
MOD_FUNWEATHER_T_TIP_SPRING_RAIN_1="Frühlingsregen - die Pflanzen jubeln, die Wege weniger."
MOD_FUNWEATHER_T_TIP_SPRING_RAIN_2="Gratis-Gießen für die jungen Setzlinge. Die Kanne bleibt im Schuppen."
MOD_FUNWEATHER_T_TIP_SPRING_SNOW_1="Später Schnee! Setzlinge abdecken, der Frühling testet unsere Geduld."
MOD_FUNWEATHER_T_TIP_SPRING_SNOW_2="Schnee im April? Ein Klassiker. Er schmilzt, und die Blumen gewinnen trotzdem."
MOD_FUNWEATHER_T_TIP_SPRING_STORM_1="Frühlingsgewitter! Gewächshaus schließen und abwarten."
MOD_FUNWEATHER_T_TIP_SPRING_STORM_2="Donner! Die Setzlinge bleiben drinnen, und Sie auch."
MOD_FUNWEATHER_T_TIP_SPRING_FOG_1="Frühlingsnebel am Morgen - er lichtet sich zu einem schönen Tag."
MOD_FUNWEATHER_T_TIP_SPRING_FOG_2="Nebliger Start. Den Setzlingen geht es gut, achten Sie auf Ihre Schritte."
MOD_FUNWEATHER_T_TIP_SPRING_FROST_1="Nachtfrost! Setzlinge und junge Blüten abdecken."
MOD_FUNWEATHER_T_TIP_SPRING_FROST_2="Frostwarnung - die Tomaten bleiben noch etwas drinnen."
MOD_FUNWEATHER_T_TIP_SPRING_WIND_1="Windiger Frühlingstag - junge Pflanzen und Folie schützen."
MOD_FUNWEATHER_T_TIP_SPRING_WIND_2="Böig! Die Setzlinge niedrig halten und das Vlies gut festpinnen."
MOD_FUNWEATHER_T_TIP_SPRING_HOT_1="Heißer Frühlingstag! Abends gießen und die Setzlinge beschatten."
MOD_FUNWEATHER_T_TIP_SPRING_HOT_2="Der Sommer ist früh dran? Geben Sie den jungen Pflanzen etwas zu trinken."
MOD_FUNWEATHER_T_TIP_SPRING_NIGHT_1="Frühlingsnacht - die Pflanzen wachsen, während Sie schlafen."
MOD_FUNWEATHER_T_TIP_SPRING_NIGHT_2="Kühle Frühlingsnacht. Prüfen Sie vor dem Schlafengehen die Frostvorhersage."
MOD_FUNWEATHER_T_TIP_SUMMER_NICE_1="Perfekter Sommertag - Grill und Garten sind beide zufrieden."
MOD_FUNWEATHER_T_TIP_SUMMER_NICE_2="Sonnig und angenehm. Erdbeeren pflücken, bevor es die Vögel tun."
MOD_FUNWEATHER_T_TIP_SUMMER_CLEAR_1="Sonnig, aber frisch - arbeiten, ohne zu schmelzen."
MOD_FUNWEATHER_T_TIP_SUMMER_CLEAR_2="Klarer Himmel und kühle Brise. Jätwetter, keine Ausreden."
MOD_FUNWEATHER_T_TIP_SUMMER_CALM_1="Bewölkter Sommertag - ideal zum Jäten ohne Sonnenbrand."
MOD_FUNWEATHER_T_TIP_SUMMER_CALM_2="Mild und bewölkt. Gartenarbeit ohne zu schmelzen."
MOD_FUNWEATHER_T_TIP_SUMMER_RAIN_1="Sommerregen - der Garten trinkt, Sie können ausruhen."
MOD_FUNWEATHER_T_TIP_SUMMER_RAIN_2="Warmer Regen! Die Gurken jubeln, Sie greifen zu einem Buch."
MOD_FUNWEATHER_T_TIP_SUMMER_SNOW_1="Schnee im Sommer? Prüfen Sie den Kalender - oder die Vorhersage."
MOD_FUNWEATHER_T_TIP_SUMMER_SNOW_2="Schnee?! Das Wetter hat die Jahreszeiten verwechselt. Bleiben Sie drinnen."
MOD_FUNWEATHER_T_TIP_SUMMER_STORM_1="Sommergewitter! Werkzeug weglegen, hineingehen, den Garten später prüfen."
MOD_FUNWEATHER_T_TIP_SUMMER_STORM_2="Donner und Blitz - Spaten liegen lassen und Schutz suchen."
MOD_FUNWEATHER_T_TIP_SUMMER_FOG_1="Sommernebel am Morgen - er verzieht sich, dann kommt die Hitze."
MOD_FUNWEATHER_T_TIP_SUMMER_FOG_2="Dunstiger Sommermorgen. Eine gute Zeit für einen stillen Kaffee auf der Parzelle."
MOD_FUNWEATHER_T_TIP_SUMMER_FROST_1="Frost im Sommer? Selten. Tomaten sicherheitshalber abdecken."
MOD_FUNWEATHER_T_TIP_SUMMER_FROST_2="Ungewöhnlich kalt. Empfindliche Pflanzen abdecken."
MOD_FUNWEATHER_T_TIP_SUMMER_WIND_1="Windiger Sommertag - Tomaten und Bohnen anbinden."
MOD_FUNWEATHER_T_TIP_SUMMER_WIND_2="Böig! Die Stützen von Bohnen und Sonnenblumen prüfen."
MOD_FUNWEATHER_T_TIP_SUMMER_HOT_1="Hitzewelle! Früh oder spät gießen und selbst mehr Wasser trinken."
