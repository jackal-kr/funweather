MOD_FUNWEATHER_SHOW_TIP_DESC="Krátká vtipná rada podle počasí a ročního období."
MOD_FUNWEATHER_T_TIP_WINTER_NICE_1="Mírný zimní den! Užijte si ho, zahrada ještě spí."
MOD_FUNWEATHER_T_TIP_WINTER_NICE_2="Na zimu neobvykle teplo. Rostliny moc brzy nebuďte!"
MOD_FUNWEATHER_T_TIP_WINTER_CLEAR_1="Jasné zimní slunce - nejlepší vitamin D zdarma."
MOD_FUNWEATHER_T_TIP_WINTER_CLEAR_2="Svěží a slunečno. Krásný den na procházku na zahrádku."
MOD_FUNWEATHER_T_TIP_WINTER_CALM_1="Šedý zimní den. Čas naplánovat záhony na příští sezónu."
MOD_FUNWEATHER_T_TIP_WINTER_CALM_2="Zataženo a klid. Počasí na katalog semínek a horký čaj."
MOD_FUNWEATHER_T_TIP_WINTER_RAIN_1="Zimní déšť - bahnité cesty, obujte holínky."
MOD_FUNWEATHER_T_TIP_WINTER_RAIN_2="Mokrý zimní den. Katalogy semínek a horký čaj volají."
MOD_FUNWEATHER_T_TIP_WINTER_SNOW_1="Sněhová peřina na zahrádce - přírodní mulč."
MOD_FUNWEATHER_T_TIP_WINTER_SNOW_2="Zahrada spí. Postavte si raději sněhuláka."
MOD_FUNWEATHER_T_TIP_WINTER_STORM_1="Zimní bouře! Střechu kolny zkontrolujte později, teď zůstaňte uvnitř."
MOD_FUNWEATHER_T_TIP_WINTER_STORM_2="Hromy v zimě? Vzácné. Vyčkejte někde v teple."
MOD_FUNWEATHER_T_TIP_WINTER_FOG_1="Zimní mlha - pozor na namrzlé cesty."
MOD_FUNWEATHER_T_TIP_WINTER_FOG_2="Mlha a zima. Útulný den na plánování uvnitř."
MOD_FUNWEATHER_T_TIP_WINTER_FROST_1="Mráz, jak má zima být. Zkontrolujte, zda kryty rostlin drží."
MOD_FUNWEATHER_T_TIP_WINTER_FROST_2="Mrazivý den. Nejdřív horký čaj, zahrádka až potom."
MOD_FUNWEATHER_T_TIP_WINTER_WIND_1="Silný zimní vítr - zajistěte dveře kolny a kryty."
MOD_FUNWEATHER_T_TIP_WINTER_WIND_2="Větrno a zima. Držte si čepici i netkanou textilii!"
MOD_FUNWEATHER_T_TIP_WINTER_HOT_1="Na zimu teplo! Ospalé rostliny se mohou probudit moc brzy."
MOD_FUNWEATHER_T_TIP_WINTER_HOT_2="Už jaro? Nevěřte tomu, zima se může vrátit."
MOD_FUNWEATHER_T_TIP_WINTER_NIGHT_1="Zimní noc. Zahrada odpočívá, a vy také."
MOD_FUNWEATHER_T_TIP_WINTER_NIGHT_2="Dlouhá noc, studená půda. Snít o rajčatech je dovoleno."
MOD_FUNWEATHER_T_TIP_SPRING_NICE_1="Dokonalý jarní den - čas na setí!"
MOD_FUNWEATHER_T_TIP_SPRING_NICE_2="Teplé slunce, probuzená půda. Sezóna je oficiálně zahájena."
MOD_FUNWEATHER_T_TIP_SPRING_CLEAR_1="Slunečno, ale svěže - ideální na rytí a hrabání."
MOD_FUNWEATHER_T_TIP_SPRING_CLEAR_2="Jasný jarní den. Sazenice chtějí slunce, vy kávu venku."
MOD_FUNWEATHER_T_TIP_SPRING_CALM_1="Jemná jarní obloha - dobrý den na setí a pletí."
MOD_FUNWEATHER_T_TIP_SPRING_CALM_2="Zataženo a klid: sazenice to mají rády, a vy také."
MOD_FUNWEATHER_T_TIP_SPRING_RAIN_1="Jarní déšť - rostliny jásají, cesty méně."
MOD_FUNWEATHER_T_TIP_SPRING_RAIN_2="Zalévání zdarma pro mladé sazenice. Konev zůstane v kolně."
MOD_FUNWEATHER_T_TIP_SPRING_SNOW_1="Pozdní sníh! Přikryjte sazenice, jaro zkouší naši trpělivost."
MOD_FUNWEATHER_T_TIP_SPRING_SNOW_2="Sníh v dubnu? Klasika. Roztaje a květiny stejně vyhrají."
MOD_FUNWEATHER_T_TIP_SPRING_STORM_1="Jarní bouřka! Zavřete skleník a vyčkejte."
MOD_FUNWEATHER_T_TIP_SPRING_STORM_2="Hrom! Sazenice zůstávají uvnitř, a vy také."
MOD_FUNWEATHER_T_TIP_SPRING_FOG_1="Jarní ranní mlha - rozplyne se v pěkný den."
MOD_FUNWEATHER_T_TIP_SPRING_FOG_2="Mlhavý začátek. Sazenicím nic není, dávejte pozor na krok."
MOD_FUNWEATHER_T_TIP_SPRING_FROST_1="Noční mráz! Přikryjte sazenice a mladé květy."
MOD_FUNWEATHER_T_TIP_SPRING_FROST_2="Pozor, mráz - rajčata zůstanou ještě chvíli doma."
MOD_FUNWEATHER_T_TIP_SPRING_WIND_1="Větrný jarní den - chraňte mladé rostliny a fólii."
MOD_FUNWEATHER_T_TIP_SPRING_WIND_2="Nárazový vítr! Sazenice držte nízko a textilii dobře připíchněte."
MOD_FUNWEATHER_T_TIP_SPRING_HOT_1="Horký jarní den! Zalévejte večer a sazenice zastiňte."
MOD_FUNWEATHER_T_TIP_SPRING_HOT_2="Přišlo léto dřív? Dejte mladým rostlinám napít."
MOD_FUNWEATHER_T_TIP_SPRING_NIGHT_1="Jarní noc - rostliny rostou, zatímco spíte."
MOD_FUNWEATHER_T_TIP_SPRING_NIGHT_2="Chladná jarní noc. Před spaním zkontrolujte předpověď mrazu."
MOD_FUNWEATHER_T_TIP_SUMMER_NICE_1="Dokonalý letní den - gril i zahrada souhlasí."
MOD_FUNWEATHER_T_TIP_SUMMER_NICE_2="Slunečno a příjemně. Natrhejte jahody dřív než ptáci."
MOD_FUNWEATHER_T_TIP_SUMMER_CLEAR_1="Slunečno, ale svěže - práce bez uvaření."
MOD_FUNWEATHER_T_TIP_SUMMER_CLEAR_2="Jasná obloha a chladný vánek. Počasí na pletí, žádné výmluvy."
MOD_FUNWEATHER_T_TIP_SUMMER_CALM_1="Zatažený letní den - ideální na pletí bez spálení."
MOD_FUNWEATHER_T_TIP_SUMMER_CALM_2="Mírně a zataženo. Práce na zahradě bez uvaření."
MOD_FUNWEATHER_T_TIP_SUMMER_RAIN_1="Letní déšť - zahrada pije, vy si odpočinete."
MOD_FUNWEATHER_T_TIP_SUMMER_RAIN_2="Teplý déšť! Okurky jásají, vy sáhnete po knize."
MOD_FUNWEATHER_T_TIP_SUMMER_SNOW_1="Sníh v létě? Zkontrolujte kalendář - nebo předpověď."
MOD_FUNWEATHER_T_TIP_SUMMER_SNOW_2="Sníh?! Počasí si popletlo roční období. Zůstaňte uvnitř."
MOD_FUNWEATHER_T_TIP_SUMMER_STORM_1="Letní bouřka! Odložte nářadí, jděte dovnitř, zahradu zkontrolujte později."
MOD_FUNWEATHER_T_TIP_SUMMER_STORM_2="Hromy a blesky - nechte rýč a schovejte se."
MOD_FUNWEATHER_T_TIP_SUMMER_FOG_1="Letní ranní mlha - rozplyne se a pak přijde vedro."
MOD_FUNWEATHER_T_TIP_SUMMER_FOG_2="Mlhavé letní ráno. Dobrá chvíle na tichou kávu na zahrádce."
MOD_FUNWEATHER_T_TIP_SUMMER_FROST_1="Mráz v létě? Vzácné. Rajčata pro jistotu přikryjte."
MOD_FUNWEATHER_T_TIP_SUMMER_FROST_2="Neobvykle chladno. Přikryjte choulostivé rostliny."
MOD_FUNWEATHER_T_TIP_SUMMER_WIND_1="Větrný letní den - přivažte rajčata a fazole."
MOD_FUNWEATHER_T_TIP_SUMMER_WIND_2="Nárazový vítr! Zkontrolujte opory fazolí a slunečnic."
MOD_FUNWEATHER_T_TIP_SUMMER_HOT_1="Vedro! Zalévejte brzy nebo pozdě a sami pijte víc vody."
MOD_FUNWEATHER_T_TIP_SUMMER_HOT_2="Velké horko. I fazole se potí - zalévejte večer, odpočívejte ve stínu."
MOD_FUNWEATHER_T_TIP_SUMMER_NIGHT_1="Teplá letní noc - cvrčci, hvězdy a rostoucí zelenina."
MOD_FUNWEATHER_T_TIP_SUMMER_NIGHT_2="Letní noc. Okurky rostou, zatímco odpočíváte."
MOD_FUNWEATHER_T_TIP_AUTUMN_NICE_1="Zlatý podzimní den - sklízejte a hrabejte listí na slunci."
MOD_FUNWEATHER_T_TIP_AUTUMN_NICE_2="Mírně a slunečno: užijte si to, poslední teplé dny jsou dar."
MOD_FUNWEATHER_T_TIP_AUTUMN_CLEAR_1="Jasný podzimní den - skvělý na sklizeň a sázení cibulovin."
MOD_FUNWEATHER_T_TIP_AUTUMN_CLEAR_2="Svěže a slunečno. Ideální na poslední jablka."
MOD_FUNWEATHER_T_TIP_AUTUMN_CALM_1="Šedý podzimní den - dobrý na úklid záhonů a kompost."
MOD_FUNWEATHER_T_TIP_AUTUMN_CALM_2="Zataženo a klid. Hrabejte listí, překopejte kompost, buďte produktivní."
MOD_FUNWEATHER_T_TIP_AUTUMN_RAIN_1="Podzimní déšť - půda pije, vy zůstanete v suchu."
MOD_FUNWEATHER_T_TIP_AUTUMN_RAIN_2="Mokrý podzimní den. Holínky a horký čaj, zahrada počká do zítřka."
MOD_FUNWEATHER_T_TIP_AUTUMN_SNOW_1="První sníh! Čas uzavřít sezónu."
MOD_FUNWEATHER_T_TIP_AUTUMN_SNOW_2="Brzký sníh - chraňte choulostivé rostliny a zavřete rok."
MOD_FUNWEATHER_T_TIP_AUTUMN_STORM_1="Podzimní bouře! Zajistěte kolnu a zůstaňte uvnitř."
MOD_FUNWEATHER_T_TIP_AUTUMN_STORM_2="Hrom a vítr. Padají větve - raději zůstaňte uvnitř."
MOD_FUNWEATHER_T_TIP_AUTUMN_FOG_1="Podzimní mlha - náladová a krásná, ale pozor na listí."
MOD_FUNWEATHER_T_TIP_AUTUMN_FOG_2="Mlhavé podzimní ráno. Kluzké listí, dávejte pozor na cestách."
MOD_FUNWEATHER_T_TIP_AUTUMN_FROST_1="První mráz! Zaneste choulostivé rostliny dovnitř a dokončete sklizeň."
MOD_FUNWEATHER_T_TIP_AUTUMN_FROST_2="Noční mráz - utrhněte, co zbylo, zbytek přikryjte."
MOD_FUNWEATHER_T_TIP_AUTUMN_WIND_1="Větrný podzimní den - listí všude, hrabání až později."
MOD_FUNWEATHER_T_TIP_AUTUMN_WIND_2="Nárazový vítr! Listí si s vámi hraje. Počkejte, až se uklidní."
MOD_FUNWEATHER_T_TIP_AUTUMN_HOT_1="Na podzim teplo - babí léto! Užijte si sklizeň venku."
MOD_FUNWEATHER_T_TIP_AUTUMN_HOT_2="Pozdní letní bonus - zahrada je šťastná, a vy také."
MOD_FUNWEATHER_T_TIP_AUTUMN_NIGHT_1="Podzimní noc - zahrada se ukládá k zimnímu spánku."
MOD_FUNWEATHER_T_TIP_AUTUMN_NIGHT_2="Chladná podzimní noc. Kompost pracuje, vy můžete odpočívat."
